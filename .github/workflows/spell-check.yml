name: Spell Check Markdown

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.md'
      - '**/en/*.md'
      - '**/en/*.markdown'
      - 'specs/**/*.md'
      - 'skills/**/*.md'
      - '.claude/**/*.md'
      - '.github/**/*.md'

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Get changed Markdown files
        id: files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            1.0/en/**/*.md
            *.md
            specs/**/*.md
            skills/**/*.md
            .claude/**/*.md
            .github/**/*.md
          separator: '\n'

      - name: Run cspell on changed files
        if: steps.files.outputs.any_changed == 'true'
        run: |
          # Convert literal '\n' to real newlines for safe file splitting
          files_string="${{ steps.files.outputs.all_changed_files }}"
          files_string="${files_string//\\n/$'\n'}"
          files=()
          while IFS= read -r file; do
            [ -n "$file" ] && files+=("$file")
          done <<< "$files_string"
          # Exit early if no files to check
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files to check."
            exit 0
          fi
          # Run cspell on all changed files; its exit code will control the workflow outcome
          npx cspell --config .github/workflows/config/cspell.json "${files[@]}"
